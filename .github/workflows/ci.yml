name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go tests (launcher)
        run: cd tools/launcher && go test ./...
      - name: Run regression tests
        run: |
          # 跑 package.json 里定义的完整套件，而不是在这里另抄一份清单：
          # 抄写的那份早已落后（新增的 test-ocr / test-ocr-cli / test-hidden /
          # test-revision-ocr / test-docx / test-reportxml / test-v494 等
          # 都没进去），漏跑的套件等于没有门禁。npm test 是唯一事实源。
          npm test
