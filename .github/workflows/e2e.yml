name: E2E

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'test-e2e.mjs'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          # playwright 的版本由 tools/run-e2e.mjs 统一决定（唯一事实源），
          # 这里不写死版本号，免得两处各写一份、各漂移。
          # 顺带修掉了原先「重置 package.json 再装依赖」的老写法：那会把仓库的
          # package.json 覆盖成空壳（CI 里虽不影响结果，但等于没测真实的配置）。
          PW_VER=$(node tools/run-e2e.mjs --print-version)
          echo "playwright@$PW_VER"
          # --with-deps 要装系统依赖，需要 sudo；某些新 runner 镜像上它会失败
          # （如 ubuntu26.04 + 某些 playwright 版本会报「不支持该平台」）。
          # 这时退一步只装浏览器本体——runner 镜像里通常已带齐运行库。
          npx --yes "playwright@$PW_VER" install --with-deps chromium \
            || npx --yes "playwright@$PW_VER" install chromium

      - name: Run E2E smoke
        run: node tools/run-e2e.mjs
